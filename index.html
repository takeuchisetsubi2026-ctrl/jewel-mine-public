.cell.filled{border:1px solid var(--edge)!important;box-shadow:inset 0 3px 0 #ffffff66,inset 0 -5px 0 #00000035,inset 3px 0 0 #ffffff25,inset -3px 0 0 #00000020!important;}

.cell.filled::before{border-radius:0!important;opacity:.22!important;}

.cell.filled{transition:none!important;}

   No gradient, extra brightness or saturation: only size changes. */

body:not(.fever) .tray .piece .unit:not(.empty)::before,

             linear-gradient(160deg,rgba(255,255,255,.24) 0%,transparent 31%,rgba(0,0,0,.02) 68%,rgba(0,0,0,.32) 100%),
             var(--color);
}

.bestcard,.scorehero,.topreset{
 background:linear-gradient(155deg,#a45b27 0%,#713917 11%,#3e1d0e 60%,#291207 100%)!important;
 border:3px solid #bf7536!important;
 box-shadow:inset 0 2px 0 #f7ba7170,inset 0 -5px 0 #1c0908aa,0 5px 0 #1b0806,0 10px 20px #0008!important;
 color:#ffd981!important;
}
.bestcard{border-radius:16px!important;min-height:66px!important;padding:8px 5px!important}
.bestcard span{font-size:10px!important;color:#ffe09a!important;letter-spacing:.4px!important}
.bestcard strong{font-size:clamp(17px,4vw,24px)!important;color:#ffdb75!important;text-shadow:0 2px 1px #4c2007,0 3px 6px #0009!important}
.scorehero{border-radius:22px!important;padding:9px 8px!important;min-height:100px!important}
.scorehero::before{background:linear-gradient(#ffe394,#ffae34)!important;clip-path:polygon(0 40%,30% 55%,40% 10%,50% 55%,70% 10%,80% 55%,100% 40%,95% 100%,5% 100%)!important;width:34px!important;height:17px!important;top:-11px!important}
.scorelabel{font-size:13px!important;color:#ffcf75!important;letter-spacing:1.5px!important}

function ensureSingleGem(){if(state.gems.some(x=>x!==null))return;const occupied=[];for(let i=0;i<64;i++)if(state.board[i]!==null)occupied.push(i);if(occupied.length)state.gems[occupied[Math.floor(Math.random()*occupied.length)]]=rollGem()}
function collectGems(indices){const found=[];for(const i of indices){const id=state.gems[i];if(id===null)continue;const type=BONUS_TABLE.find(g=>g.id===id);state.gems[i]=null;if(!type)continue;state.bonus+=type.points;state.finds[id]=(state.finds[id]||0)+1;found.push({type,origin:i})}return found}
function hasMoves(){return state.pieces.some(p=>!p.used&&Array.from({length:64},(_,i)=>valid(p,Math.floor(i/8),i%8)).some(Boolean))}
function finishGame(){const total=state.score+state.bonus;state.best=Math.max(state.best,total);$('final').textContent=total.toLocaleString();$('basefinal').textContent=state.score.toLocaleString();$('bonusfinal').textContent='+'+state.bonus.toLocaleString();const types=BONUS_TABLE.filter(x=>state.finds[x.id]);$('foundfinal').textContent=types.length?types.map(x=>x.icon+'×'+state.finds[x.id]).join(' '):'今回の宝石なし';render();$('over').showModal()}
let animationLocked=false;let revealTimers=[];
function showClearToast(lines,comboChain,totalPoints){centerComboOnBoard();
 const main=`<div class="combo-head"><span class="combo-num">${comboChain}</span><span class="combo-word">COMBO</span></div>`;
 const msg=`TOTAL +${totalPoints.toLocaleString()}`;
 toast(main,msg,'combo');
}
// Non-blocking, brief jewel reward. Players may immediately move the next piece.
function animateRescue(found){
 const type=found.type;
 document.querySelector('.gem-bonus-pop')?.remove();
 const pop=document.createElement('div');pop.className='gem-bonus-pop';
 const icon=document.createElement('div');icon.className='gem-bonus-icon';icon.textContent=type.icon;
 const name=document.createElement('div');name.className='gem-bonus-title';name.textContent=type.name+' 発見！';
 const points=document.createElement('div');points.className='gem-bonus-points';points.textContent='JEWEL BONUS +'+type.points.toLocaleString();
 pop.append(icon,name,points);document.body.appendChild(pop);
 const rect=boardEl.getBoundingClientRect();pop.style.setProperty('--jewel-pop-y', (rect.top+rect.height/2)+'px');
 const timer=setTimeout(()=>pop.remove(),700);revealTimers.push(timer);
}
function playReveals(found,done){
 animationLocked=false;
 if(found.length&& !hasMoves())revealTimers.push(setTimeout(done,700));
 else done();
}
function burstClearedCells(indices){
 const layer=$('burstLayer');if(!indices.length)return;
 const frag=document.createDocumentFragment();
 // Sample a limited number of cells; every cleared cell receives an impact shimmer.
 const sampled=indices.length>32?indices.filter((_,i)=>i%2===0):indices;
 let sx=0,sy=0,n=0;
 for(const idx of sampled){
  const tile=boardEl.children[idx];if(!tile)continue;
  const rect=tile.getBoundingClientRect();
  const color=COLORS[state.board[idx]]||'#b99b75';
  const edge=EDGES[state.board[idx]]||'#615246';
  sx+=rect.left+rect.width/2;sy+=rect.top+rect.height/2;n++;
  // Mix large chips, fine dust, and bright sparks. All animate via transforms.
  for(let k=0;k<6;k++){
   const bit=document.createElement('i');
   const angle=(k/6)*Math.PI*2+((idx*13)%17)*.21;
   const distance=35+((idx*11+k*19)%45);
   const size=k<3?rect.width*.3:rect.width*.12;
   bit.className='burst-bit'+(k>=4?' burst-spark':'');
   bit.style.left=(rect.left+rect.width*(.29+.15*(k%3)))+'px';
   bit.style.top=(rect.top+rect.height*(.3+.17*(k%2)))+'px';
   bit.style.width=Math.max(3,size)+'px';bit.style.height=Math.max(3,size)+'px';
   bit.style.setProperty('--burst-color',k>=4?'#ffe7a3':k%2?edge:color);
   bit.style.setProperty('--tx',(Math.cos(angle)*distance)+'px');
   bit.style.setProperty('--ty',(Math.sin(angle)*distance+20)+'px');
   bit.style.setProperty('--rotation',((k%2?1:-1)*(130+k*29))+'deg');
   frag.appendChild(bit);
  }
  const flash=document.createElement('i');flash.className='burst-flash';
  flash.style.left=(rect.left+rect.width/2)+'px';flash.style.top=(rect.top+rect.height/2)+'px';
  frag.appendChild(flash);
 }
 if(n){const shock=document.createElement('i');shock.className='burst-shock';shock.style.left=(sx/n)+'px';shock.style.top=(sy/n)+'px';frag.appendChild(shock)}
 layer.appendChild(frag);
 setTimeout(()=>{layer.replaceChildren()},800);
}
function place(r,c){
 if(animationLocked)return;
 if(selected<0){$('message').textContent='';return}
 const p=state.pieces[selected];if(!p||p.used||!valid(p,r,c)){toast('ここには置けない');return}
 prev=clone(state);
 const targets=SHAPES[p.s].map(([x,y])=>(r+y)*N+(c+x));
 if(targets.some(i=>i<0||i>=64||state.board[i]!==null)){toast('ここには置けない');return}
 buzz('place');for(const i of targets)state.board[i]=p.color;

 p.used=true;const rows=[],cols=[];
 for(let i=0;i<N;i++){
   if(Array.from({length:N},(_,j)=>state.board[i*N+j]).every(v=>v!==null))rows.push(i);
   if(Array.from({length:N},(_,j)=>state.board[j*N+i]).every(v=>v!==null))cols.push(i)
 }
 const lines=rows.length+cols.length;
 const feverWasActive = state.feverTurns>0;
 const feverMultiplier = feverWasActive ? 2 : 1;
 const placementPoints=targets.length*10*feverMultiplier;state.score+=placementPoints;
 const found=[];
 let comboBonus=0;
 let justTriggeredFever=false;
 if(lines){
   buzz('clear');document.querySelector('.boardwrap').classList.add('haptic-clear');setTimeout(()=>document.querySelector('.boardwrap').classList.remove('haptic-clear'),190);
   if(state.comboRemain>0) state.comboChain += 1;
   else state.comboChain = 1;
   state.comboRemain = 3;
   const clearCells=[...new Set(Array.from({length:64},(_,i)=>i).filter(i=>rows.includes(Math.floor(i/N))||cols.includes(i%N)))];
   burstClearedCells(clearCells);
   found.push(...collectGems(clearCells));
   if(found.length)animateRescue(found[0]);
   for(const gem of found){ state.bonus += gem.type.points*(feverMultiplier-1); }
   for(const idx of clearCells) state.board[idx]=null;
   // +0.1% per cleared line, stacking for the current run without a cap.
   // The line score scales; jewel awards, placement points and all-clear bonus do not.
   state.totalLines+=lines;
   const lineMultiplier=1+state.totalLines*0.01;
   const clearScore = Math.round((lines*300 + Math.max(0,lines-1)*150)*lineMultiplier*feverMultiplier);
   comboBonus = (state.comboChain>1 ? (state.comboChain-1)*100*lines : 0)*feverMultiplier;
   const fullClear = state.board.every(v=>v===null);
   const fullClearBonus = (fullClear ? 1000 : 0)*feverMultiplier;
   state.score += clearScore + comboBonus + fullClearBonus;
   state.feverProgress += lines;
   while(state.feverProgress>=20){state.feverProgress-=20;state.feverTurns+=5;justTriggeredFever=true}
   const comboTotal = placementPoints + clearScore + comboBonus + fullClearBonus + found.reduce((sum,x)=>sum+x.type.points*feverMultiplier,0);
   showClearToast(lines,state.comboChain,comboTotal);
   if(fullClear) setTimeout(()=>toast('ALL CLEAR!','+1,000 POINTS'),1650);
   if(justTriggeredFever) setTimeout(()=>toast('FEVER TIME!','5 TURNS ×2'),220);
 }else{
   scoreTick(placementPoints);
   if(state.comboRemain>0){
     state.comboRemain -= 1;
     if(state.comboRemain<=0) state.comboChain = 0;
   }
 }
 ensureSingleGem();
 state.turn++;
 if(feverWasActive && state.feverTurns>0) state.feverTurns -= 1;
 if(state.pieces.every(x=>x.used))state.pieces=makePieces(state.board);
 selected=-1;
 $('message').textContent='';
 render();
 const noMoves=!hasMoves();
 playReveals(found,()=>{if(noMoves)finishGame()});
}
function reset(){$('burstLayer').replaceChildren();const best=state.best;state=fresh();state.best=best;prev=null;selected=-1;revealTimers.forEach(clearTimeout);revealTimers=[];document.querySelector('.gem-bonus-pop')?.remove();$('over').close?.();$('message').textContent='';render()};boardEl.addEventListener('click',e=>{if(drag||suppressTap||animationLocked)return;const el=e.target.closest('.cell');if(!el)return;const i=Number(el.dataset.i);place(Math.floor(i/N),i%N)});
// Pointer drag v0.2: a real floating block follows ABOVE the finger, showing exact placement.
function dragCellSize(){const c=boardEl.children[0], n=boardEl.children[1];return {size:c.getBoundingClientRect().width,pitch:n.getBoundingClientRect().left-c.getBoundingClientRect().left};}
function dragPosition(e){if(!drag)return;const d=drag, first=boardEl.children[0].getBoundingClientRect();let left=e.clientX-d.width/2, top=e.clientY-d.lift-d.height/2;d.ghost.style.left=left+'px';d.ghost.style.top=top+'px';let c=Math.round((left-first.left)/d.pitch),r=Math.round((top-first.top)/d.pitch);d.r=r;d.c=c;const good=r>=0&&c>=0&&r<N&&c<N&&valid(state.pieces[d.index],r,c);d.good=good;d.ghost.classList.toggle('invalid',!good);if(r>=-2&&c>=-2&&r<N&&c<N){selected=d.index;preview(r,c);if(!good&&r>=0&&c>=0) $('message').textContent='';else if(good&&!document.querySelector('.boardwrap').classList.contains('readyline'))$('message').textContent='';}else{clearPreview();$('message').textContent='';}}
function endDrag(e,cancel=false){if(!drag||e.pointerId!==drag.id)return;dragPosition(e);const d=drag;drag=null;clearPreview();document.querySelector('.boardwrap').classList.remove('dragactive');d.ghost.remove();suppressTap=true;setTimeout(()=>suppressTap=false,350);if(!cancel&&d.good&&valid(state.pieces[d.index],d.r,d.c)){selected=d.index;place(d.r,d.c)}else{selected=d.index;render();$('message').textContent='';}}
tray.addEventListener('pointerdown',e=>{const el=e.target.closest('.piece');if(!el||drag||animationLocked)return;const i=Number(el.dataset.p);if(state.pieces[i].used)return;e.preventDefault();buzz('pick');selected=i;render();const p=state.pieces[i],shape=SHAPES[p.s], [w,h]=dims(shape), {size,pitch}=dragCellSize();const ghost=document.createElement('div');ghost.className='dragghost';ghost.style.setProperty('--cell',size+'px');ghost.style.gridTemplateColumns=`repeat(${w},${size}px)`;ghost.style.gridTemplateRows=`repeat(${h},${size}px)`;ghost.style.gap=(pitch-size)+'px';ghost.style.width=(w*size+(w-1)*(pitch-size))+'px';ghost.style.height=(h*size+(h-1)*(pitch-size))+'px';for(let y=0;y<h;y++)for(let x=0;x<w;x++){let u=document.createElement('div');const on=shape.some(q=>q[0]===x&&q[1]===y);u.className='unit'+(on?'':' empty');if(on){u.style.setProperty('--color',COLORS[p.color]);u.style.setProperty('--edge',EDGES[p.color])}ghost.appendChild(u)}document.body.appendChild(ghost);drag={id:e.pointerId,index:i,ghost,pitch,width:parseFloat(ghost.style.width),height:parseFloat(ghost.style.height),lift:105,r:-1,c:-1,good:false};document.querySelector('.boardwrap').classList.add('dragactive');dragPosition(e);});
window.addEventListener('pointermove',e=>{if(drag&&drag.id===e.pointerId){e.preventDefault();dragPosition(e)}},{passive:false});
window.addEventListener('pointerup',e=>endDrag(e));window.addEventListener('pointercancel',e=>endDrag(e,true));
// Tap-to-select remains usable if dragging is difficult.
tray.addEventListener('click',e=>{if(suppressTap)return;const el=e.target.closest('.piece');if(!el)return;const i=Number(el.dataset.p);if(state.pieces[i].used)return;buzz('pick');selected=i;render();});
$('restart').addEventListener('click',()=>{if(!animationLocked)$('resetConfirm').showModal()});$('resetNo').addEventListener('click',()=>$('resetConfirm').close());$('resetYes').addEventListener('click',()=>{$('resetConfirm').close();reset()});$('again').addEventListener('click',reset);render();if(!canPlay())finishGame()
})();</script></body></html>
