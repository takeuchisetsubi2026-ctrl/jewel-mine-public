.cell.filled{border:1px solid var(--edge)!important;box-shadow:inset 0 3px 0 #ffffff66,inset 0 -5px 0 #00000035,inset 3px 0 0 #ffffff25,inset -3px 0 0 #00000020!important;}

.cell.filled::before{border-radius:0!important;opacity:.22!important;}

.cell.filled{transition:none!important;}

   No gradient, extra brightness or saturation: only size changes. */

body:not(.fever) .tray .piece .unit:not(.empty)::before,

             linear-gradient(160deg,rgba(255,255,255,.24) 0%,transparent 31%,rgba(0,0,0,.02) 68%,rgba(0,0,0,.32) 100%),
             var(--color);
}

.bestcard,.scorehero,.topreset{
 background:linear-gradient(155deg,#a45b27 0%,#713917 11%,#3e1d0e 60%,#291207 100%)!important;
 border:3px solid #bf7536!important;
 box-shadow:inset 0 2px 0 #f7ba7170,inset 0 -5px 0 #1c0908aa,0 5px 0 #1b0806,0 10px 20px #0008!important;
 color:#ffd981!important;
}
.bestcard{border-radius:16px!important;min-height:66px!important;padding:8px 5px!important}
.bestcard span{font-size:10px!important;color:#ffe09a!important;letter-spacing:.4px!important}
.bestcard strong{font-size:clamp(17px,4vw,24px)!important;color:#ffdb75!important;text-shadow:0 2px 1px #4c2007,0 3px 6px #0009!important}
.scorehero{border-radius:22px!important;padding:9px 8px!important;min-height:100px!important}
.scorehero::before{background:linear-gradient(#ffe394,#ffae34)!important;clip-path:polygon(0 40%,30% 55%,40% 10%,50% 55%,70% 10%,80% 55%,100% 40%,95% 100%,5% 100%)!important;width:34px!important;height:17px!important;top:-11px!important}
.scorelabel{font-size:13px!important;color:#ffcf75!important;letter-spacing:1.5px!important}
.scorevalue{color:#ffdb67!important;font-size:clamp(45px,11vw,67px)!important;text-shadow:0 2px 0 #ffe9a8,0 4px 0 #bd6716,0 7px 0 #743608,0 12px 12px #0009!important;}
.topreset{height:62px!important;min-width:60px!important;border-radius:15px!important;color:#ffe8b0!important;font-size:29px!important;}
.rulebar{color:#ffe4a3!important;background:linear-gradient(90deg,transparent,#1a0909a8 14%,#1a0909a8 86%,transparent)!important;text-shadow:0 2px 3px #000!important;margin-bottom:14px!important;min-height:24px!important;padding:4px!important}
.boardshell{margin:12px auto 22px!important;aspect-ratio:1!important;}
/* Structural wooden board rim; no decorative image interferes with interaction. */
.boardwrap,body.fever .boardwrap{
 inset:18px!important;padding:6px!important;background:linear-gradient(140deg,#8b4c21,#54290e 40%,#52230f 80%,#a15d24)!important;
 border:5px solid #955225!important;border-radius:14px!important;
 box-shadow:inset 0 3px 1px #d88b468c,inset 0 -5px 0 #231006,0 0 0 3px #2c1108,0 8px 0 #1d0a08,0 14px 24px #0009!important;
 overflow:hidden!important;
}
.board{gap:0!important;background:#26130f!important;border:2px solid #20100b!important;box-shadow:0 0 0 1px #c57e3855!important;}
.cell:not(.filled),body:not(.fever) .board .cell:not(.filled),body.fever .cell:not(.filled){
 border:1px solid #623722!important;border-radius:3px!important;
 background:linear-gradient(145deg,#59301d,#361b11 62%,#2e140e)!important;
 box-shadow:inset 0 2px 0 #ae68451a,inset 0 -2px 0 #16090355!important;
}
/* One definitive material formula for all three states (board, tray, drag),
   including fever: bevel/gloss stays identical after placement. */
.board .cell.filled:not(.preview):not(.bad):not(.willclear),
body:not(.fever) .board .cell.filled:not(.preview):not(.bad):not(.willclear),
body.fever .board .cell.filled:not(.preview):not(.bad):not(.willclear),
.tray .piece .unit:not(.empty),body:not(.fever) .tray .piece .unit:not(.empty),body.fever .tray .piece .unit:not(.empty),
.dragghost .unit:not(.empty),body:not(.fever) .dragghost .unit:not(.empty),body.fever .dragghost .unit:not(.empty){
 background:
  linear-gradient(135deg,rgba(255,255,255,.66) 0%,rgba(255,255,255,.26) 7%,rgba(255,255,255,.08) 13%,transparent 30%),
  linear-gradient(160deg,rgba(255,255,255,.20) 0%,transparent 31%,rgba(0,0,0,.02) 68%,rgba(0,0,0,.34) 100%),
  var(--color)!important;

 border:1px solid var(--edge)!important;
 border-radius:1px!important;
 box-shadow:inset 0 3px 0 #ffffff8c,inset 3px 0 0 #ffffff40,inset 0 -5px 0 #0000004d,inset -4px 0 0 #00000022!important;
 filter:none!important;opacity:1!important;
}
.board .cell.filled::before,.tray .unit:not(.empty)::before,.dragghost .unit:not(.empty)::before{display:none!important;content:none!important}
.tray{margin:26px 0 4px!important;gap:7px!important;padding:7px!important;background:linear-gradient(170deg,#ab642a,#663414 50%,#57260f)!important;border:3px solid #a35b29!important;border-radius:22px!important;box-shadow:inset 0 2px 0 #ef9a4a70,0 7px 0 #2b1009,0 12px 25px #0008!important;}
.piece,body.fever .piece{
 min-height:108px!important;background:linear-gradient(145deg,#4b2315,#2c160f)!important;
 border:2px solid #b17236!important;border-radius:16px!important;
 box-shadow:inset 0 3px 6px #100702a0,0 1px 0 #d2884566!important;
 overflow:hidden!important;
}
.piece.sel,body.fever .piece.sel{background:linear-gradient(145deg,#5b2d16,#392017)!important;border-color:#ffe099!important;box-shadow:inset 0 3px 7px #13080199,0 0 0 2px #ffc84c80,0 0 14px #ffb54066!important;}
.piece.used{opacity:.26!important}
.piece.used .unit:not(.empty){opacity:.6!important}
.mini{gap:0!important}
.piece .mini{gap:0!important}
.piece .unit,.piece .unit:not(.empty){border-radius:0!important}
.mini .unit.empty,.dragghost .unit.empty{background:transparent!important;border:0!important;box-shadow:none!important;opacity:0!important}
.dragghost{gap:0!important;filter:drop-shadow(0 8px 7px #0009)!important}
.footer{color:#e8c28a!important;text-shadow:0 1px 2px #000!important;opacity:.8!important;font-size:10px!important}
.ad-space{height:56px!important}
#meterSegs .meter-light{background:#241b22!important;border-color:#765642!important;box-shadow:inset 0 1px 0 #c58955a0!important}
#meterSegs .meter-light.active{background:#ffd23d!important;border-color:#fff1b3!important;box-shadow:0 0 7px #ffb02f,0 0 14px #ffb02f7a!important}
body.fever,body.fever .app{background-color:#0c1327!important}
body.fever .scorehero{background:linear-gradient(155deg,#344572,#151b37)!important;border-color:#ffdb70!important}
body.fever .boardwrap{box-shadow:inset 0 2px 0 #b9804b,0 0 0 3px #8af5ff77,0 0 17px #6cfaff99,0 12px 26px #000b!important}
body.fever .piece{background:linear-gradient(145deg,#283c5c,#161d3a)!important;border-color:#6e93c4!important}
body.fever .piece.sel{background:linear-gradient(145deg,#30496b,#171c35)!important;border-color:#ffe099!important}
body.fever .boardwrap .cell.filled{filter:none!important}
@media(max-width:390px){.app{padding-left:10px!important;padding-right:10px!important}.hud{gap:7px!important;grid-template-columns:93px minmax(0,1fr) 61px!important}.boardwrap{inset:16px!important;padding:5px!important}.piece{min-height:96px!important}.scorehero{min-height:87px!important}.scorevalue{font-size:clamp(43px,12vw,58px)!important}}

/* v3.1 Safari-friendly colored tiles: one shared formula for board, tray and dragged shape */
.board .cell.filled:not(.preview):not(.bad):not(.willclear),
.tray .piece .unit:not(.empty),
.dragghost .unit:not(.empty){
  background-color:var(--color)!important;
  background-image:linear-gradient(135deg,rgba(255,255,255,.52) 0%,rgba(255,255,255,.16) 12%,transparent 33%),linear-gradient(160deg,transparent 45%,rgba(0,0,0,.26) 100%)!important;
  border:2px solid var(--edge)!important;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.52),inset 3px 0 0 rgba(255,255,255,.24),inset 0 -5px 0 rgba(0,0,0,.34),inset -4px 0 0 rgba(0,0,0,.18)!important;
  opacity:1!important;filter:none!important;
}
body.fever .board .cell.filled:not(.preview):not(.bad):not(.willclear),
body.fever .tray .piece .unit:not(.empty),body.fever .dragghost .unit:not(.empty){
  background-color:var(--color)!important;
  filter:brightness(1.18) saturate(1.14)!important;
}

.app:after{background:radial-gradient(ellipse at 50% 24%,#ffc76b0b 0%,transparent 58%)!important;}
.cave-decor{filter:drop-shadow(0 5px 4px #14090375) saturate(1.35) contrast(1.15)!important;}
.cave-lantern{width:clamp(65px,17vw,91px)!important;height:178px!important;top:calc(4px + env(safe-area-inset-top))!important;left:-9px!important;opacity:1!important;}
.cave-crystal{width:clamp(85px,20vw,120px)!important;height:165px!important;top:calc(116px + env(safe-area-inset-top))!important;right:-11px!important;opacity:1!important;}
.cave-pickaxe{width:clamp(146px,42vw,215px)!important;height:154px!important;right:-6px!important;bottom:0!important;opacity:1!important;}
/* multi-layer timber borders, steel rivets, and visible inset depth */
.boardwrap{
  border:5px solid #a66a35!important;
  background:linear-gradient(145deg,#8d4d22,#512915)!important;
  box-shadow:inset 0 0 0 2px #ecb16a,inset 0 0 0 5px #52270f,
    0 6px 0 #341608,0 10px 19px #0c0304a8,0 0 0 1px #251109!important;
}
.boardshell{filter:drop-shadow(0 9px 12px #10050585)!important;}
/* Deep but distinguishable slate-brown empty cells */
.board .cell:not(.filled){
  background:linear-gradient(145deg,#4a281d 0%,#331a14 100%)!important;
  border:1px solid #664333!important;
  box-shadow:inset 0 1px 0 #bb805022,inset 1px 0 0 #bb805017,inset 0 -2px 0 #1b0a0885!important;
}
/* Same chunky bevel on board, reserve tray and grabbed piece; avoids placement color-shift */
.board .cell.filled:not(.preview):not(.bad):not(.willclear),
.tray .piece .unit:not(.empty),
.dragghost .unit:not(.empty){
  background-color:var(--color)!important;
  background-image:
    linear-gradient(135deg,#ffffffa3 0%,#ffffff60 5%,transparent 26%),
    linear-gradient(180deg,#ffffff2e 0%,transparent 27%,#00000020 100%)!important;
  border:1px solid var(--edge)!important;
  border-radius:1px!important;
  box-shadow:
    inset 0 4px 0 #ffffff82,
    inset 4px 0 0 #ffffff32,
    inset 0 -6px 0 #00000040,
    inset -5px 0 0 #00000031,
    inset 0 0 0 1px #ffffff20!important;
  opacity:1!important;
  filter:none!important;
}
/* Preserve the distinct luminous fever atmosphere, with equal tile design */
body.fever .board .cell.filled:not(.preview):not(.bad):not(.willclear),
body.fever .tray .piece .unit:not(.empty),
body.fever .dragghost .unit:not(.empty){filter:brightness(1.17) saturate(1.13)!important;}
/* Show wood grain on three trays without hiding pieces */
.tray .piece{background:linear-gradient(135deg,#5d321e 0%,#432115 50%,#2e160f 100%)!important;
 border:3px solid #a96736!important;
 box-shadow:inset 0 2px 0 #d49753a0,inset 0 0 0 3px #31170f,0 6px 0 #261208,0 9px 12px #10070583!important;}
.tray{background:linear-gradient(180deg,#b16c31,#86451f 60%,#4b240f)!important;
 border:3px solid #d18c49!important;border-radius:24px!important;
 box-shadow:inset 0 3px 0 #eab06c8a,0 7px 12px #100503a1!important;}
.scorehero,.bestcard,.topreset{border-color:#c98a4d!important;}
@media(max-width:390px){.cave-lantern{width:61px!important;height:153px!important;left:-9px!important}.cave-crystal{width:77px!important;height:120px!important;right:-9px!important}}

   const comboTotal = placementPoints + clearScore + comboBonus + fullClearBonus + found.reduce((sum,x)=>sum+x.type.points*feverMultiplier,0);
   showClearToast(lines,state.comboChain,comboTotal);
   if(fullClear) setTimeout(()=>toast('ALL CLEAR!','+1,000 POINTS'),1650);
   if(justTriggeredFever) setTimeout(()=>toast('FEVER TIME!','5 TURNS ×2'),220);
 }else{
   scoreTick(placementPoints);
   if(state.comboRemain>0){
     state.comboRemain -= 1;

   }
 }
