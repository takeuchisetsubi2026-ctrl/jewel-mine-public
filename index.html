  const edge=EDGES[state.board[idx]]||'#615246';
  sx+=rect.left+rect.width/2;sy+=rect.top+rect.height/2;n++;
  // Mix large chips, fine dust, and bright sparks. All animate via transforms.
  for(let k=0;k<6;k++){
   const bit=document.createElement('i');
   const angle=(k/6)*Math.PI*2+((idx*13)%17)*.21;
   const distance=35+((idx*11+k*19)%45);
   const size=k<3?rect.width*.3:rect.width*.12;
   bit.className='burst-bit'+(k>=4?' burst-spark':'');
   bit.style.left=(rect.left+rect.width*(.29+.15*(k%3)))+'px';
   bit.style.top=(rect.top+rect.height*(.3+.17*(k%2)))+'px';
   bit.style.width=Math.max(3,size)+'px';bit.style.height=Math.max(3,size)+'px';
   bit.style.setProperty('--burst-color',k>=4?'#ffe7a3':k%2?edge:color);

  }

  flash.style.left=(rect.left+rect.width/2)+'px';flash.style.top=(rect.top+rect.height/2)+'px';
  frag.appendChild(flash);
 }
 if(n){const shock=document.createElement('i');shock.className='burst-shock';shock.style.left=(sx/n)+'px';shock.style.top=(sy/n)+'px';frag.appendChild(shock)}
 layer.appendChild(frag);
 setTimeout(()=>{layer.replaceChildren()},800);
}
function place(r,c){
 if(animationLocked)return;
 if(selected<0){$('message').textContent='';return}
 const p=state.pieces[selected];if(!p||p.used||!valid(p,r,c)){toast('ここには置けない');return}
 prev=clone(state);
 const targets=SHAPES[p.s].map(([x,y])=>(r+y)*N+(c+x));
 if(targets.some(i=>i<0||i>=64||state.board[i]!==null)){toast('ここには置けない');return}
 buzz('place');for(const i of targets)state.board[i]=p.color;

 p.used=true;const rows=[],cols=[];
 for(let i=0;i<N;i++){
   if(Array.from({length:N},(_,j)=>state.board[i*N+j]).every(v=>v!==null))rows.push(i);
   if(Array.from({length:N},(_,j)=>state.board[j*N+i]).every(v=>v!==null))cols.push(i)
 }
 const lines=rows.length+cols.length;
 const feverWasActive = state.feverTurns>0;
 const feverMultiplier = feverWasActive ? 2 : 1;
 const placementPoints=targets.length*10*feverMultiplier;state.score+=placementPoints;
 const found=[];
 let comboBonus=0;
 let justTriggeredFever=false;
 if(lines){
   buzz('clear');document.querySelector('.boardwrap').classList.add('haptic-clear');setTimeout(()=>document.querySelector('.boardwrap').classList.remove('haptic-clear'),190);
   if(state.comboRemain>0) state.comboChain += 1;
   else state.comboChain = 1;
   state.comboRemain = 3;
   const clearCells=[...new Set(Array.from({length:64},(_,i)=>i).filter(i=>rows.includes(Math.floor(i/N))||cols.includes(i%N)))];
   burstClearedCells(clearCells);
   found.push(...collectGems(clearCells));
   for(const gem of found){ state.bonus += gem.type.points*(feverMultiplier-1); }
   for(const idx of clearCells) state.board[idx]=null;
   const clearScore = (lines*300 + Math.max(0,lines-1)*150)*feverMultiplier;
   comboBonus = (state.comboChain>1 ? (state.comboChain-1)*100*lines : 0)*feverMultiplier;
   const fullClear = state.board.every(v=>v===null);
   const fullClearBonus = (fullClear ? 1000 : 0)*feverMultiplier;
   state.score += clearScore + comboBonus + fullClearBonus;
   state.feverProgress += lines;
   while(state.feverProgress>=20){state.feverProgress-=20;state.feverTurns+=5;justTriggeredFever=true}
   const comboTotal = placementPoints + clearScore + comboBonus + fullClearBonus + found.reduce((sum,x)=>sum+x.type.points*feverMultiplier,0);
   showClearToast(lines,state.comboChain,comboTotal);
   if(fullClear) setTimeout(()=>toast('ALL CLEAR!','+1,000 POINTS'),1650);
   if(justTriggeredFever) setTimeout(()=>toast('FEVER TIME!','5 TURNS ×2'),220);
 }else{
   scoreTick(placementPoints);
   if(state.comboRemain>0){
     state.comboRemain -= 1;
     if(state.comboRemain<=0) state.comboChain = 0;
   }
 }
 ensureSingleGem();
 state.turn++;
 if(feverWasActive && state.feverTurns>0) state.feverTurns -= 1;
 if(state.pieces.every(x=>x.used))state.pieces=makePieces(state.board);
 selected=-1;
 $('message').textContent='';
 render();
 const noMoves=!hasMoves();
 playReveals(found,()=>{if(noMoves)finishGame()});
}
function reset(){$('burstLayer').replaceChildren();const best=state.best;state=fresh();state.best=best;prev=null;selected=-1;revealTimers.forEach(clearTimeout);revealTimers=[];document.querySelector('.gem-bonus-pop')?.remove();$('over').close?.();$('message').textContent='';render()};boardEl.addEventListener('click',e=>{if(drag||suppressTap||animationLocked)return;const el=e.target.closest('.cell');if(!el)return;const i=Number(el.dataset.i);place(Math.floor(i/N),i%N)});

function dragCellSize(){const c=boardEl.children[0], n=boardEl.children[1];return {size:c.getBoundingClientRect().width,pitch:n.getBoundingClientRect().left-c.getBoundingClientRect().left};}
